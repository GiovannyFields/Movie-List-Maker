{% extends "base.html" %}

{% set editing = movie and movie.id %}
{% set m = movie or {} %}

{% block content %}
<h1>{{ "Edit Movie" if editing else "Add Movie to " ~ movie_list.name }}</h1>

<form method="post" class="form">
  <label>Title
    <input name="title" value="{{ m.title or '' }}" required maxlength="200">
  </label>
  <div class="row">
    <label>Year
      <input name="year" type="number" min="1888" max="2100" value="{{ m.year or '' }}">
    </label>
    <label>Genre
      <input name="genre" value="{{ m.genre or '' }}" maxlength="50">
    </label>
    <label>Rating
      <select name="rating">
        <option value="">-</option>
        {% for n in range(1, 11) %}
          <option value="{{ n }}" {{ "selected" if m.rating == n }}>{{ n }}</option>
        {% endfor %}
      </select>
    </label>
  </div>
  <label>About
    <textarea name="overview" maxlength="500" rows="3">{{ m.overview or '' }}</textarea>
  </label>
  <label class="inline">
    <input type="checkbox" name="watched" {{ "checked" if m.watched }}> Watched it
  </label>
  <div class="actions">
    <button type="submit" class="btn">{{ "Save" if editing else "Add Movie" }}</button>
    <a href="{{ url_for('movie_detail', movie_id=m.id) if editing else url_for('list_detail', list_id=movie_list.id) }}">Cancel</a>
  </div>
</form>
{% endblock %}
